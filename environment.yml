name: act

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.10
  - pip
  - setuptools>=77
  - wheel

  # Official PLDI'26 environment
  - numpy=1.26.4
  - scipy=1.13.1
  - matplotlib=3.8.4
  - pandas=2.2.1
  - requests=2.32.2
  - pytest
  - pylint=3.2.2
  - autopep8=2.0.4
  - flake8=7.0.0
  - wget=1.21.4

  # Native build tools
  - cmake>=3.20,<4
  - make
  - ninja
  - pkg-config
  - rust
  - graphviz
  - nlohmann_json=3.12.0
  - c-compiler
  - cxx-compiler

  - pip:
      # Keep pip's transitive resolution consistent with the Conda NumPy pin.
      - numpy==1.26.4
      - jax==0.4.33
      - jaxlib==0.4.33
      - ml-dtypes==0.4.1
      - antlr4-python3-runtime==4.9.2
      - nanobind==2.8.0
