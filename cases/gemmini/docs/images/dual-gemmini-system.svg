<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1480" height="1080" viewBox="0 0 1480 1080" role="img" aria-labelledby="title description">
  <title id="title">Experiment 05: one Rocket CPU, two Gemmini engines, shared memory</title>
  <desc id="description">The Rocket CPU routes custom3 instructions to Gemmini 0 and custom2 to Gemmini 1. Each engine has a private controller and queues, 16 by 16 INT8 systolic array, 256 KiB scratchpad and 64 KiB INT32 accumulator. Both DMA ports and the CPU L1 caches connect to a shared 128-bit TileLink bus and a 512 KiB inclusive L2. External single-channel DDR3 timing is simulated by DRAMSim2. DoubleGEMM is a software command macro, not a new hardware opcode. Conceptual diagram based on ActGemminiConfigs.scala and upstream Gemmini architecture; PTW/TLB and detailed wiring are omitted.</desc>
  <defs>
    <marker id="command-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#087f8c"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #182b43; }
      .heading { font-size: 30px; font-weight: 700; }
      .subheading { font-size: 20px; fill: #506175; }
      .label { font-size: 22px; font-weight: 700; }
      .detail { font-size: 18px; fill: #506175; }
      .small { font-size: 16px; fill: #506175; }
      .center { text-anchor: middle; }
      .frame { fill: #ffffff; stroke: #b6c3d2; stroke-width: 2; }
      .compute { fill: #f3f0ff; stroke: #8266c2; stroke-width: 2; }
      .memory { fill: #eefafa; stroke: #087f8c; stroke-width: 2; }
      .control-box { fill: #eff5ff; stroke: #2563eb; stroke-width: 2; }
      .command { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#command-arrow); }
      .data { fill: none; stroke: #087f8c; stroke-width: 3; marker-end: url(#data-arrow); }
      .bidirectional { marker-start: url(#data-arrow); }
    </style>
    <!-- The identical engine body is reused; each instance owns its memories. -->
    <g id="engine">
      <rect width="478" height="417" rx="12" class="frame"/>
      <rect x="20" y="52" width="438" height="64" rx="8" class="control-box"/>
      <text x="239" y="79" class="label center">Controller / command queues</text>
      <text x="239" y="103" class="small center">Load, store, execute · local dependency checks</text>
      <rect x="20" y="143" width="180" height="90" rx="8" class="memory"/>
      <text x="110" y="171" class="label center">Scratchpad</text>
      <text x="110" y="196" class="detail center">256 KiB</text>
      <text x="110" y="219" class="small center">4 banks · INT8</text>
      <rect x="248" y="143" width="210" height="90" rx="8" class="compute"/>
      <text x="353" y="172" class="label center">16×16 array</text>
      <text x="353" y="197" class="detail center">INT8 inputs</text>
      <text x="353" y="220" class="small center">WS in this experiment</text>
      <path d="M 202 188 H 244" class="data"/>
      <rect x="20" y="279" width="180" height="82" rx="8" class="memory"/>
      <text x="110" y="313" class="label center">Read / write</text>
      <text x="110" y="340" class="label center">DMA</text>
      <rect x="248" y="279" width="210" height="82" rx="8" class="memory"/>
      <text x="353" y="306" class="label center">ACC · INT32</text>
      <text x="353" y="335" class="detail center">64 KiB · 2 banks</text>
      <path d="M 110 275 V 237" class="data"/>
      <path d="M 353 237 V 275" class="data"/>
      <path d="M 244 320 H 204" class="data"/>
      <text x="458" y="399" class="small" text-anchor="end">Own SRAMs, controller and compute array</text>
    </g>
  </defs>
  <rect width="1480" height="1080" fill="#ffffff"/>
  <text x="44" y="48" class="heading">Dual Gemmini: the hardware simulated in experiment 05</text>
  <text x="44" y="81" class="subheading">One SoC, two identical compute engines, private SRAMs and a shared memory system</text>
  <path d="M 930 108 H 980" class="command"/>
  <text x="996" y="114" class="small">Command</text>
  <path d="M 1140 108 H 1190" class="data bidirectional"/>
  <text x="1206" y="114" class="small">Data / memory</text>

  <rect x="24" y="134" width="1432" height="726" rx="18" fill="#f8fafc" stroke="#a0aec0" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="44" y="166" class="detail">RTL SoC · Verilator</text>

  <rect x="48" y="220" width="272" height="304" rx="12" class="frame"/>
  <text x="68" y="252" class="label">Rocket CPU ×1</text>
  <rect x="68" y="270" width="232" height="76" rx="8" class="control-box"/>
  <text x="184" y="300" class="label center">RV64 core</text>
  <text x="184" y="327" class="detail center">Runs native C / ELF</text>
  <path d="M 184 350 V 394" class="data bidirectional"/>
  <rect x="68" y="398" width="232" height="80" rx="8" class="memory"/>
  <text x="184" y="430" class="label center">L1 I / D caches</text>
  <text x="184" y="458" class="detail center">32 KiB each</text>

  <path d="M 302 308 H 350 V 207 H 436" class="command"/>
  <text x="363" y="291" class="small">RoCC</text>
  <rect x="440" y="182" width="950" height="50" rx="8" class="control-box"/>
  <text x="915" y="214" class="label center">RoCC command router · opcode selects the engine</text>
  <use xlink:href="#engine" x="420" y="283"/>
  <use xlink:href="#engine" x="934" y="283"/>
  <text x="440" y="314" class="label">Gemmini 0</text>
  <text x="954" y="314" class="label">Gemmini 1</text>
  <path d="M 659 234 V 331" class="command"/>
  <path d="M 1173 234 V 331" class="command"/>
  <text x="674" y="266" class="detail">custom3 → lane 0</text>
  <text x="1188" y="266" class="detail">custom2 → lane 1</text>

  <path d="M 184 482 V 742 M 530 648 V 742 M 1044 648 V 742" fill="none" stroke="#087f8c" stroke-width="3"/>
  <path d="M 184 742 H 1044" fill="none" stroke="#087f8c" stroke-width="5"/>
  <circle cx="530" cy="742" r="5" fill="#087f8c"/>
  <circle cx="795" cy="742" r="5" fill="#087f8c"/>
  <text x="786" y="728" class="detail center">Shared TileLink system bus · 128-bit</text>
  <path d="M 795 742 V 776" fill="none" stroke="#087f8c" stroke-width="3"/>
  <rect x="560" y="778" width="470" height="58" rx="9" class="memory"/>
  <text x="795" y="815" class="label center">Shared inclusive L2 cache · 512 KiB</text>
  <path d="M 795 840 V 914" class="data bidirectional"/>
  <text x="819" y="889" class="detail">AXI memory port</text>
  <rect x="560" y="918" width="470" height="78" rx="10" class="memory"/>
  <text x="795" y="950" class="label center">Shared DDR3 · one channel</text>
  <text x="795" y="980" class="detail center">DRAMSim2 timing model · not HBM</text>

  <text x="44" y="1032" class="detail">DoubleGEMM: issue to both engines, then one completion fence. No new hardware opcode.</text>
  <text x="44" y="1060" class="small">Conceptual connections; PTW/TLB, detailed controller wiring and optional datapaths are omitted. Native GEMM data flow shown.</text>
</svg>
